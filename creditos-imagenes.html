<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://m.media-amazon.com https://images-na.ssl-images-amazon.com; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="./velans-seguridad.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Créditos de imágenes — Velan’s</title>
<meta name="description" content="Autores y licencias de las fotografías con licencia libre que se usan en Velan’s.">
<link rel="canonical" href="https://velans.es/creditos-imagenes.html">
<link rel="icon" type="image/png" href="monogram.png">
<style>
  :root{--ink:#25242a;--subtle:#6b6c72;--edge:#e7e4df;--canvas:#f6f5f2;--bronze:#9a7148}
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.65 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 60px}
  .back{display:inline-block;margin-bottom:22px;color:var(--bronze);font-weight:600;text-decoration:none}
  .back:hover{text-decoration:underline}
  .logo{font:500 30px Georgia,serif;margin:0 0 4px}
  .logo span{color:#b28b62}
  h1{font-size:28px;line-height:1.25;margin:6px 0 6px}
  .upd{color:var(--subtle);font-size:14px;margin:0 0 28px}
  section{background:#fff;border:1px solid var(--edge);border-radius:10px;padding:20px 22px;margin:0 0 16px}
  h2{font-size:20px;margin:0 0 10px}
  h3{font-size:16px;margin:16px 0 6px}
  p,li{margin:0 0 10px}
  ul{padding-left:20px;margin:0 0 10px}
  dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
  dt{font-weight:600}
  dd{margin:0}
  a{color:var(--bronze)}
  @media(max-width:520px){dl{grid-template-columns:1fr}dd{margin-bottom:8px}h1{font-size:24px}}
  .foto{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
  .foto img{width:96px;height:96px;object-fit:contain;background:#fff;border:1px solid var(--edge);border-radius:8px}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="./">← Volver a Velan’s</a>
  <p class="logo">Velan<span>’</span>s</p>
  <h1>Créditos de imágenes</h1>
  <p class="upd">Algunas fotografías de productos proceden de bancos de imágenes con licencia libre. Agradecemos a sus autores que las compartan. Las marcas y diseños que aparecen pertenecen a sus titulares; su uso es solo identificativo.</p>

</main>
</body>
</html>
