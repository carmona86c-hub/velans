name: Informe semanal (lunes)

on:
  schedule:
    - cron: "11 5 * * 1"   # lunes ~6:11 / 7:11 en España
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: velans-main-push
  cancel-in-progress: false

jobs:
  informe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar informe
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_INFORME_CHAT: ${{ secrets.TELEGRAM_INFORME_CHAT }}
        run: python3 scripts/informe_semanal.py
      - name: Guardar informe
        run: |
          git config user.name "velans-bot"
          git config user.email "velans-bot@users.noreply.github.com"
          git add data/informe 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Informe semanal"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
