name: Velans - capturar ofertas con presupuesto
on:
  # EN PAUSA: para reactivar, quita las almohadillas de las dos líneas siguientes.
  # schedule:
  #   - cron: '15 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: velans-gangagato-capture
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verificar reglas de seguridad del presupuesto
        run: node --test tests/*.test.mjs
      - name: Reservar presupuesto y capturar nuevas publicaciones
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TASK_ID: vKORYqAgvKcxPSAbC
        run: node scripts/sync-gangagato.mjs
      - name: Guardar únicamente las nuevas publicaciones
        run: |
          git add data/gangagato-feed.json
          if git diff --cached --quiet; then
            echo 'Sin novedades; no se crea ninguna versión.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Actualizar feed de ofertas pendientes (sin publicar)'
          git push
