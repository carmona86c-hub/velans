name: Velans - buscar fotos libres del catálogo
# Busca cada producto en Wikimedia Commons y Open Beauty Facts y guarda una
# lista de fotos CANDIDATAS (con autor y licencia) en la rama «fotos-libres».
# No cambia la web publicada. Se lanza a mano con el botón «Run workflow».
on:
  workflow_dispatch:
    inputs:
      desde:
        description: 'Empezar en el producto número (0 = el primero)'
        default: '0'
      limite:
        description: 'Cuántos productos revisar (vacío = todos)'
        default: ''
permissions:
  contents: write
concurrency:
  group: velans-fotos-libres
  cancel-in-progress: false
jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Comprobar el filtro de licencias
        run: node --test tests/fotos-libres.test.mjs
      - name: Buscar fotos libres
        env:
          DESDE: ${{ inputs.desde }}
          LIMITE: ${{ inputs.limite }}
        run: |
          ARGS="--desde ${DESDE:-0}"
          if [ -n "$LIMITE" ]; then ARGS="$ARGS --limite $LIMITE"; fi
          node scripts/buscar-fotos-libres.mjs $ARGS
      - name: Hojas de contacto para revisar las fotos
        run: |
          pip install --quiet pillow
          python3 scripts/hoja-contactos.py
      - name: Guardar la lista en la rama fotos-libres
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B fotos-libres
          git add -f data/fotos-libres-candidatas.json data/fotos-libres-candidatas.csv data/fotos-libres-candidatas.md data/hoja-*.jpg data/hojas-indice.json
          git commit -m "Fotos libres candidatas $(date -u +%Y-%m-%d)"
          git push --force origin fotos-libres
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fotos-libres-candidatas
          path: data/fotos-libres-candidatas.*
