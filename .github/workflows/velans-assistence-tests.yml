name: Pruebas de Velan's Assistence
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - name: Preparar el navegador de pruebas
        run: npm install --prefix "$RUNNER_TEMP/velans-browser" --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Probar el asistente en móvil y escritorio
        run: NODE_PATH="$RUNNER_TEMP/velans-browser/node_modules" VELANS_BROWSER_PATH="$(command -v google-chrome)" node tests/velans-asistente.browser.mjs
